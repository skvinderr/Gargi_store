<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Corner Store</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a nice look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5; /* A light grey background */
        }
        .modal-enter {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- App Container -->
    <div id="app" class="container mx-auto p-4 md:p-8 max-w-7xl">

        <!-- Header -->
        <header class="text-center mb-8 md:mb-12">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Gargi Hostel Store</h1>
                <button id="my-orders-button" class="bg-white border border-gray-300 text-gray-700 font-semibold px-4 py-2 rounded-full hover:bg-gray-100 transition">My Orders</button>
            </div>
            <p class="text-lg text-gray-600">Welcome, <span id="welcome-name" class="font-semibold text-blue-600">Guest</span>!</p>
            <div class="mt-2 text-xs text-gray-500">
                Logged in as: <span id="user-email" class="font-mono bg-gray-200 p-1 rounded">loading...</span>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Products Section -->
            <div id="product-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                <!-- Product cards will be dynamically inserted here -->
            </div>
             <p id="no-products-message" class="text-center text-gray-500 mt-10 hidden">No products found.</p>
        </main>

        <!-- Floating Cart Button -->
        <div id="cart-button" class="fixed bottom-6 right-6 cursor-pointer transform hover:scale-110 transition-transform">
            <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-600 drop-shadow-lg" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" />
                </svg>
                <span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full h-6 w-6 flex items-center justify-center">0</span>
            </div>
        </div>

    </div> <!-- End App Container -->

    <!-- Login & Details Modal -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="modal-enter bg-white rounded-2xl shadow-2xl w-full max-w-sm">
            <div class="p-8">
                <h2 id="form-title" class="text-2xl font-bold mb-6 text-center">Login</h2>
                <form id="auth-form" class="space-y-4">
                    <div id="name-field-container" class="hidden space-y-4">
                        <input type="text" id="student-name" placeholder="Your Full Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <input type="tel" id="student-phone" placeholder="Your Phone Number" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <input type="email" id="auth-email" placeholder="Email Address" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="auth-password" placeholder="Password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    
                    <button id="auth-submit-button" type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">Login</button>
                </form>
                <p class="text-center text-sm text-gray-600 mt-6">
                    <span id="toggle-text">Don't have an account?</span>
                    <button id="auth-toggle-button" class="text-blue-600 font-semibold" type="button">Sign Up</button>
                </p>
            </div>
        </div>
    </div>


    <!-- Cart & Order Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-40">
        <div class="modal-enter bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Confirm Your Order</h2>
                <button id="close-cart-modal-button" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <div id="cart-items-container" class="p-6 overflow-y-auto flex-grow">
                <p id="empty-cart-message" class="text-gray-500">Your cart is empty.</p>
            </div>
            <div class="p-6 bg-gray-50 border-t border-gray-200">
                 <div class="mb-4">
                     <label for="room-number" class="block text-sm font-medium text-gray-700 mb-1">Room Number for Delivery</label>
                     <input type="text" id="room-number" placeholder="e.g., B-204" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                 </div>
                 <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-semibold text-gray-700">Total:</span>
                    <span id="cart-total" class="text-2xl font-bold text-blue-600">₹0</span>
                </div>
                <button id="place-order-button" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">Place Order</button>
            </div>
        </div>
    </div>

    <!-- My Orders Modal -->
    <div id="orders-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-40">
        <div class="modal-enter bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">My Order History</h2>
                <button id="close-orders-modal-button" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <div id="orders-list-container" class="p-6 overflow-y-auto flex-grow space-y-4">
                <!-- Orders will be dynamically inserted here -->
                <p id="no-orders-message" class="text-gray-500">You haven't placed any orders yet.</p>
            </div>
        </div>
    </div>
    
    <!-- Generic Message Modal -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="modal-enter bg-white rounded-2xl shadow-xl w-full max-w-sm text-center p-8">
            <p id="message-text" class="text-lg text-gray-700 mb-6">Message goes here.</p>
            <button id="close-message-modal" class="bg-blue-600 text-white font-semibold py-2 px-8 rounded-lg hover:bg-blue-700 transition">OK</button>
        </div>
    </div>


    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, getDocs, addDoc, serverTimestamp, onSnapshot, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. CONFIGURATION & INITIALIZATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hostel-store-app';
        const firebaseConfig = {
  apiKey: "AIzaSyDhqtZPy2BsA9xT_MUtbxvuOvBu8OfXA-E",
  authDomain: "my-hostel-store.firebaseapp.com",
  projectId: "my-hostel-store",
  storageBucket: "my-hostel-store.firebasestorage.app",
  messagingSenderId: "639080703365",
  appId: "1:639080703365:web:20bd28def3c8a4443990ec"
};

        let app, auth, db, userDetails;
        let cart = {};
        let isSignUp = false;
        let unsubscribeOrders; // To detach the real-time listener

        // DOM Elements
        const productListEl = document.getElementById('product-list');
        const cartButton = document.getElementById('cart-button');
        const cartModal = document.getElementById('cart-modal');
        const closeCartModalButton = document.getElementById('close-cart-modal-button');
        const cartCountEl = document.getElementById('cart-count');
        const cartItemsContainerEl = document.getElementById('cart-items-container');
        const emptyCartMessageEl = document.getElementById('empty-cart-message');
        const cartTotalEl = document.getElementById('cart-total');
        const userEmailEl = document.getElementById('user-email');
        const welcomeNameEl = document.getElementById('welcome-name');
        
        // Modals & Buttons
        const loginModal = document.getElementById('login-modal');
        const messageModal = document.getElementById('message-modal');
        const messageTextEl = document.getElementById('message-text');
        const closeMessageModalButton = document.getElementById('close-message-modal');
        const myOrdersButton = document.getElementById('my-orders-button');
        const ordersModal = document.getElementById('orders-modal');
        const closeOrdersModalButton = document.getElementById('close-orders-modal-button');
        const ordersListContainer = document.getElementById('orders-list-container');
        const noOrdersMessage = document.getElementById('no-orders-message');
        
        // Auth Form
        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const nameFieldContainer = document.getElementById('name-field-container');
        const authSubmitButton = document.getElementById('auth-submit-button');
        const toggleText = document.getElementById('toggle-text');
        const authToggleButton = document.getElementById('auth-toggle-button');


        // --- 2. AUTHENTICATION & USER MANAGEMENT ---

        async function initialize() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        await fetchUserDetails(user.uid);
                        listenToOrders(user.uid);
                    } else {
                        loginModal.classList.remove('hidden');
                        if (unsubscribeOrders) unsubscribeOrders(); // Stop listening if user logs out
                    }
                });
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                showMessage("Could not connect to the store. Please refresh the page.");
            }
        }

        async function fetchUserDetails(uid) {
            const userRef = doc(db, `/artifacts/${appId}/public/data/users`, uid);
            const docSnap = await getDoc(userRef);

            if (docSnap.exists()) {
                userDetails = { uid, ...docSnap.data() };
                welcomeNameEl.textContent = userDetails.name.split(' ')[0];
                userEmailEl.textContent = userDetails.email;
                loginModal.classList.add('hidden');
                loadProducts();
            } else {
                console.warn("User document not found for UID:", uid);
                showMessage("Could not find your user details. Please sign up again.");
                auth.signOut();
            }
        }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            formTitle.textContent = isSignUp ? "Sign Up" : "Login";
            authSubmitButton.textContent = isSignUp ? "Sign Up" : "Login";
            toggleText.textContent = isSignUp ? "Already have an account?" : "Don't have an account?";
            authToggleButton.textContent = isSignUp ? "Login" : "Sign Up";
            nameFieldContainer.classList.toggle('hidden', !isSignUp);
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('student-name').value;
            const phone = document.getElementById('student-phone').value;

            authSubmitButton.disabled = true;

            try {
                if (isSignUp) {
                    if (!name || !phone) {
                        showMessage("Please enter your name and phone number.");
                        authSubmitButton.disabled = false;
                        return;
                    }
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    const newUserDetails = { name, email, phone };
                    const userDocRef = doc(db, `/artifacts/${appId}/public/data/users`, user.uid);
                    await setDoc(userDocRef, newUserDetails);
                    
                    await fetchUserDetails(user.uid);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error("Authentication error:", error);
                showMessage(error.message);
            } finally {
                authSubmitButton.disabled = false;
            }
        }

        // --- 3. PRODUCT & CART LOGIC ---
        
        function loadProducts() {
            const products = [
                { id: 'maggi-noodles', name: 'Instant Noodles (Maggi)', price: 25, imageUrl: 'https://m.media-amazon.com/images/I/812ujEPZcML._UF1000,1000_QL80_.jpg' },
                { id: 'lays-chips', name: 'Potato Chips (Lays)', price: 20, imageUrl: 'https://m.media-amazon.com/images/I/61e+UwnsWwL._UF1000,1000_QL80_.jpg' },
                { id: 'coca-cola', name: 'Cola Drink (500ml)', price: 40, imageUrl: 'https://5.imimg.com/data5/SELLER/Default/2022/7/PS/VP/PU/122190343/1643370825263-sku-0048-0.jpg' },
                { id: 'dairy-milk', name: 'Chocolate Bar (Dairy Milk)', price: 50, imageUrl: 'https://m.media-amazon.com/images/I/61GmTQ6mykL._UF1000,1000_QL80_.jpg' },
                { id: 'oreo-biscuits', name: 'Cream Biscuits (Oreo)', price: 30, imageUrl: 'https://m.media-amazon.com/images/I/61VK7wFSYML._UF1000,1000_QL80_.jpg' },
                { id: 'colgate-toothpaste', name: 'Toothpaste (100g)', price: 60, imageUrl: 'https://m.media-amazon.com/images/I/717qpxX82kL.jpg' },
                { id: 'classmate-notebook', name: 'Notebook', price: 35, imageUrl: 'https://m.media-amazon.com/images/I/718vM+75UNL._UF1000,1000_QL80_.jpg' },
                { id: 'ballpoint-pen', name: 'Ballpoint Pen', price: 10, imageUrl: 'https://m.media-amazon.com/images/I/41rZSyfniRL.jpg' },
                { id: 'shampoo-sachet', name: 'Shampoo Sachet', price: 5, imageUrl: 'https://m.media-amazon.com/images/I/41zbnnmeveL._UF1000,1000_QL80_.jpg' },
                { id: 'washing-soap', name: 'Washing Soap', price: 15, imageUrl: 'https://m.media-amazon.com/images/I/51NGcsJEFdL._UF1000,1000_QL80_.jpg' },
                { id: 'detergent-powder', name: 'Detergent Powder (500g)', price: 50, imageUrl: 'https://m.media-amazon.com/images/I/61b1k2+8J6L._UF1000,1000_QL80_.jpg' },
                { id: 'toilet-paper', name: 'Toilet Paper Roll', price: 20, imageUrl: 'https://m.media-amazon.com/images/I/61a5d7e4YpL._UF1000,1000_QL80_.jpg' },
                { id: 'handwash-liquid', name: 'Liquid Handwash (250ml)', price: 70, imageUrl: 'https://m.media-amazon.com/images/I/61b1k2+8J6L._UF1000,1000_QL80_.jpg' },
                { id: 'sanitizer', name: 'Hand Sanitizer (50ml)', price: 30, imageUrl: 'https://m.media-amazon.com/images/I/61a5d7e4YpL._UF1000,1000_QL80_.jpg' },
                { id: 'face-mask', name: 'Face Mask (Pack of 10)', price: 100, imageUrl: 'https://m.media-amazon.com/images/I/61b1k2+8J6L._UF1000,1000_QL80_.jpg' },
            ];

            productListEl.innerHTML = '';
            products.forEach((product) => productListEl.appendChild(createProductCard(product)));
        }

        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-xl shadow-md flex flex-col justify-between";
            card.dataset.productId = product.id;
            
            card.innerHTML = `
                <div>
                    <img src="${product.imageUrl}" onerror="this.onerror=null;this.src='https://placehold.co/400x300/EBF4FF/3B82F6?text=Image';"
                         alt="${product.name}" class="w-full h-24 md:h-32 object-cover rounded-lg mb-4">
                    <h3 class="font-semibold text-gray-800 text-sm md:text-base">${product.name}</h3>
                    <p class="font-bold text-lg md:text-xl text-blue-600 mt-1">₹${product.price}</p>
                </div>
                <div class="mt-4" id="cart-controls-${product.id}">
                    <button class="add-to-cart-btn w-full bg-blue-100 text-blue-700 font-semibold py-2 px-4 rounded-lg hover:bg-blue-200 transition">Add to Cart</button>
                </div>
            `;
            
            card.querySelector('.add-to-cart-btn').addEventListener('click', () => modifyCart(product.id, product, 1));
            return card;
        }

        function updateProductCardUI(productId) {
            const controlsContainer = document.getElementById(`cart-controls-${productId}`);
            if (!controlsContainer) return;

            const quantity = cart[productId] ? cart[productId].quantity : 0;

            if (quantity > 0) {
                controlsContainer.innerHTML = `
                    <div class="flex items-center justify-between">
                        <button class="cart-modifier-btn bg-red-200 text-red-800 rounded-md p-2 w-10">-</button>
                        <span class="font-bold text-lg">${quantity}</span>
                        <button class="cart-modifier-btn bg-green-200 text-green-800 rounded-md p-2 w-10">+</button>
                    </div>
                `;
                const [minusBtn, plusBtn] = controlsContainer.querySelectorAll('.cart-modifier-btn');
                const productData = cart[productId];
                minusBtn.addEventListener('click', () => modifyCart(productId, productData, -1));
                plusBtn.addEventListener('click', () => modifyCart(productId, productData, 1));
            } else {
                controlsContainer.innerHTML = `<button class="add-to-cart-btn w-full bg-blue-100 text-blue-700 font-semibold py-2 px-4 rounded-lg hover:bg-blue-200 transition">Add to Cart</button>`;
                const productCard = document.querySelector(`[data-product-id='${productId}']`);
                const productData = {
                    name: productCard.querySelector('h3').textContent,
                    price: parseFloat(productCard.querySelector('p').textContent.replace('₹', ''))
                };
                controlsContainer.querySelector('.add-to-cart-btn').addEventListener('click', () => modifyCart(productId, productData, 1));
            }
        }

        function modifyCart(id, data, amount) {
            if (!cart[id] && amount > 0) {
                cart[id] = { name: data.name, price: data.price, quantity: amount };
            } else if (cart[id]) {
                cart[id].quantity += amount;
                if (cart[id].quantity <= 0) delete cart[id];
            }
            updateCart();
            updateProductCardUI(id);
        }

        function updateCart() {
            let totalItems = 0;
            let totalPrice = 0;
            cartItemsContainerEl.innerHTML = ''; 

            const itemIds = Object.keys(cart);

            if (itemIds.length === 0) {
                emptyCartMessageEl.classList.remove('hidden');
            } else {
                emptyCartMessageEl.classList.add('hidden');
                itemIds.forEach(id => {
                    const item = cart[id];
                    totalItems += item.quantity;
                    totalPrice += item.price * item.quantity;
                    const itemEl = document.createElement('div');
                    itemEl.className = "flex items-center justify-between py-3 border-b border-gray-100";
                    itemEl.innerHTML = `<div><p class="font-semibold">${item.name}</p><p class="text-sm text-gray-500">₹${item.price} x ${item.quantity}</p></div><span class="font-semibold text-gray-800">₹${item.price * item.quantity}</span>`;
                    cartItemsContainerEl.appendChild(itemEl);
                });
            }
            cartCountEl.textContent = totalItems;
            cartTotalEl.textContent = `₹${totalPrice}`;
        }

        // --- 4. ORDER MANAGEMENT ---

        async function onPlaceOrder() {
            const roomNumber = document.getElementById('room-number').value;
            if (!roomNumber) {
                showMessage("Please enter your room number for delivery.");
                return;
            }
            if (Object.keys(cart).length === 0) {
                showMessage("Your cart is empty.");
                return;
            }
            
            const totalAmount = Object.values(cart).reduce((sum, item) => sum + item.price * item.quantity, 0);
            const orderData = {
                orderedByName: userDetails.name,
                orderedByUID: userDetails.uid,
                phone: userDetails.phone || "Not Provided", // FIX: Provide a default value
                roomNumber,
                items: cart,
                totalAmount,
                status: 'Pending',
                createdAt: serverTimestamp(),
            };
            
            try {
                await addDoc(collection(db, `/artifacts/${appId}/public/data/orders`), orderData);
                cartModal.classList.add('hidden');
                showMessage("🎉 Order Placed Successfully!");
                cart = {};
                updateCart();
                document.querySelectorAll('[data-product-id]').forEach(card => updateProductCardUI(card.dataset.productId));
                document.getElementById('room-number').value = '';
            } catch (error) {
                console.error("Error placing order: ", error);
                showMessage("Could not place your order. Please try again.");
            }
        }

        function listenToOrders(uid) {
            const ordersQuery = query(collection(db, `/artifacts/${appId}/public/data/orders`), where("orderedByUID", "==", uid));
            
            unsubscribeOrders = onSnapshot(ordersQuery, (snapshot) => {
                const orders = [];
                snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
                displayOrders(orders);
            });
        }

        function displayOrders(orders) {
            ordersListContainer.innerHTML = '';
            if (orders.length === 0) {
                noOrdersMessage.classList.remove('hidden');
                return;
            }
            noOrdersMessage.classList.add('hidden');
            
            orders.sort((a, b) => b.createdAt.toMillis() - a.createdAt.toMillis());

            orders.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'border border-gray-200 rounded-lg p-4';
                
                const statusColors = {
                    'Pending': 'bg-yellow-100 text-yellow-800',
                    'Completed': 'bg-green-100 text-green-800',
                    'Cancelled': 'bg-red-100 text-red-800',
                };
                const statusColor = statusColors[order.status] || 'bg-gray-100 text-gray-800';

                let itemsHtml = '<ul class="list-disc list-inside text-sm text-gray-600 mt-2">';
                for (const key in order.items) {
                    const item = order.items[key];
                    itemsHtml += `<li>${item.name} (x${item.quantity})</li>`;
                }
                itemsHtml += '</ul>';

                orderCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-gray-500">Order on: ${new Date(order.createdAt.toMillis()).toLocaleString()}</p>
                            <p class="text-lg font-bold">Total: ₹${order.totalAmount}</p>
                        </div>
                        <span class="px-3 py-1 text-sm font-semibold rounded-full ${statusColor}">${order.status}</span>
                    </div>
                    ${itemsHtml}
                    ${order.status === 'Pending' ? `<button data-order-id="${order.id}" class="cancel-order-btn mt-4 bg-red-500 text-white text-sm font-semibold py-1 px-3 rounded-md hover:bg-red-600">Cancel Order</button>` : ''}
                `;
                ordersListContainer.appendChild(orderCard);
            });

            document.querySelectorAll('.cancel-order-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const orderId = e.target.dataset.orderId;
                    if (confirm("Are you sure you want to cancel this order?")) {
                        await cancelOrder(orderId);
                    }
                });
            });
        }

        async function cancelOrder(orderId) {
            const orderRef = doc(db, `/artifacts/${appId}/public/data/orders`, orderId);
            try {
                await updateDoc(orderRef, { status: 'Cancelled' });
                showMessage("Order cancelled successfully.");
            } catch (error) {
                console.error("Error cancelling order: ", error);
                showMessage("Failed to cancel order.");
            }
        }

        // --- 5. UTILITIES & EVENT LISTENERS ---

        function showMessage(message) {
            messageTextEl.textContent = message;
            messageModal.classList.remove('hidden');
        }

        // Event Listeners
        authForm.addEventListener('submit', handleAuthSubmit);
        authToggleButton.addEventListener('click', toggleAuthMode);
        cartButton.addEventListener('click', () => cartModal.classList.remove('hidden'));
        closeCartModalButton.addEventListener('click', () => cartModal.classList.add('hidden'));
        myOrdersButton.addEventListener('click', () => ordersModal.classList.remove('hidden'));
        closeOrdersModalButton.addEventListener('click', () => ordersModal.classList.add('hidden'));
        document.getElementById('place-order-button').addEventListener('click', onPlaceOrder);
        closeMessageModalButton.addEventListener('click', () => messageModal.classList.add('hidden'));

        // Start the application
        initialize();

    </script>
</body>
</html>
