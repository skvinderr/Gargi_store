<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Gargi Hostel Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5f9; /* A light slate background */
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Login Screen -->
    <div id="admin-login-screen" class="fixed inset-0 bg-gray-800 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6">Admin Login</h2>
            <form id="admin-login-form" class="space-y-4">
                <input type="email" id="admin-email" placeholder="Admin Email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <input type="password" id="admin-password" placeholder="Admin Password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Admin Dashboard (hidden by default) -->
    <div id="admin-dashboard" class="hidden">
        <header class="bg-white shadow-md">
            <div class="container mx-auto p-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Gargi Store - Admin Dashboard</h1>
                <button id="logout-button" class="bg-red-500 text-white font-semibold px-4 py-2 rounded-lg hover:bg-red-600 transition">Logout</button>
            </div>
        </header>

        <main class="container mx-auto p-4 md:p-8">
            <!-- Tabs -->
            <div class="mb-8 border-b border-gray-200">
                <nav class="flex space-x-8" aria-label="Tabs">
                    <button id="orders-tab" class="tab-button font-semibold py-4 px-1 border-b-2 border-blue-500 text-blue-600">
                        Manage Orders
                    </button>
                    <button id="products-tab" class="tab-button font-semibold py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Manage Products
                    </button>
                </nav>
            </div>

            <!-- Orders Section -->
            <div id="orders-section">
                <h2 class="text-2xl font-bold mb-6">Incoming Orders</h2>
                <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Orders will be loaded here -->
                    <p id="no-orders-message" class="text-gray-500 col-span-full">No pending orders right now. Great job!</p>
                </div>
            </div>

            <!-- Products Section (hidden by default) -->
            <div id="products-section" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- Add/Edit Product Form -->
                    <div class="md:col-span-1 bg-white p-6 rounded-lg shadow">
                        <h2 class="text-2xl font-bold mb-6">Add New Product</h2>
                        <form id="product-form" class="space-y-4">
                            <input type="text" id="product-name" placeholder="Product Name" required class="w-full p-3 border rounded-md">
                            <input type="number" id="product-price" placeholder="Price (₹)" required class="w-full p-3 border rounded-md">
                            <input type="url" id="product-image-url" placeholder="Image URL" required class="w-full p-3 border rounded-md">
                            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700">Add Product</button>
                        </form>
                    </div>
                    <!-- Current Products List -->
                    <div class="md:col-span-2 bg-white p-6 rounded-lg shadow">
                        <h2 class="text-2xl font-bold mb-6">Current Products</h2>
                        <div id="products-container" class="space-y-4 max-h-96 overflow-y-auto">
                            <!-- Products will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, deleteDoc, onSnapshot, query, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. CONFIGURATION & INITIALIZATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hostel-store-app';
        
        
       const firebaseConfig = {
  apiKey: "AIzaSyDhqtZPy2BsA9xT_MUtbxvuOvBu8OfXA-E",
  authDomain: "my-hostel-store.firebaseapp.com",
  projectId: "my-hostel-store",
  storageBucket: "my-hostel-store.firebasestorage.app",
  messagingSenderId: "639080703365",
  appId: "1:639080703365:web:20bd28def3c8a4443990ec"
};


        // --- IMPORTANT: SET YOUR ADMIN CREDENTIALS HERE ---
        const ADMIN_EMAIL = "admin@gargi.com";
        const ADMIN_PASSWORD = "bello123";

        let app, db;
        let unsubscribeOrders;

        // DOM Elements
        const loginScreen = document.getElementById('admin-login-screen');
        const loginForm = document.getElementById('admin-login-form');
        const dashboard = document.getElementById('admin-dashboard');
        const logoutButton = document.getElementById('logout-button');
        const ordersTab = document.getElementById('orders-tab');
        const productsTab = document.getElementById('products-tab');
        const ordersSection = document.getElementById('orders-section');
        const productsSection = document.getElementById('products-section');
        const ordersContainer = document.getElementById('orders-container');
        const productsContainer = document.getElementById('products-container');
        const productForm = document.getElementById('product-form');

        // --- 2. AUTHENTICATION & APP LOGIC ---

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                loginScreen.classList.add('hidden');
                dashboard.classList.remove('hidden');
                initializeAppAndListeners();
            } else {
                alert("Invalid admin credentials.");
            }
        }

        function handleLogout() {
            if (unsubscribeOrders) unsubscribeOrders();
            loginScreen.classList.remove('hidden');
            dashboard.classList.add('hidden');
            document.getElementById('admin-login-form').reset();
        }

        function initializeAppAndListeners() {
            // Check if firebaseConfig is still a placeholder
            if (!firebaseConfig.projectId) {
                alert("Firebase configuration is missing. Please paste your firebaseConfig object in the admin.html file.");
                handleLogout();
                return;
            }
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                listenToOrders();
                loadProducts();
            } catch (error) {
                if (!/already exists/.test(error.message)) {
                    console.error("Firebase initialization failed:", error);
                    alert("Could not connect to the database.");
                }
            }
        }

        // --- 3. ORDER MANAGEMENT ---

        function listenToOrders() {
            const ordersQuery = query(collection(db, `/artifacts/${appId}/public/data/orders`));
            
            unsubscribeOrders = onSnapshot(ordersQuery, (snapshot) => {
                ordersContainer.innerHTML = '';
                let hasOrders = false;
                snapshot.forEach(doc => {
                    const order = { id: doc.id, ...doc.data() };
                    // Only display orders that are not completed or cancelled
                    if (order.status === 'Pending') {
                        const orderCard = createOrderCard(order);
                        ordersContainer.appendChild(orderCard);
                        hasOrders = true;
                    }
                });
                document.getElementById('no-orders-message').style.display = hasOrders ? 'none' : 'block';
            });
        }

        function createOrderCard(order) {
            const card = document.createElement('div');
            card.className = 'bg-white p-6 rounded-lg shadow-md';

            let itemsHtml = '<ul class="list-disc list-inside text-sm text-gray-600 mt-2 mb-4">';
            for (const key in order.items) {
                const item = order.items[key];
                itemsHtml += `<li>${item.name} (x${item.quantity})</li>`;
            }
            itemsHtml += '</ul>';

            card.innerHTML = `
                <div class="border-b pb-2 mb-2">
                    <p class="font-bold text-lg">${order.orderedByName}</p>
                    <p class="text-sm text-gray-500">Room: ${order.roomNumber} | Phone: ${order.phone}</p>
                </div>
                ${itemsHtml}
                <p class="font-bold text-xl text-right mb-4">Total: ₹${order.totalAmount}</p>
                <div class="flex space-x-2">
                    <button data-id="${order.id}" class="update-status-btn flex-1 bg-green-500 text-white font-semibold py-2 rounded-md hover:bg-green-600" data-status="Completed">Mark as Completed</button>
                    <button data-id="${order.id}" class="update-status-btn flex-1 bg-red-500 text-white font-semibold py-2 rounded-md hover:bg-red-600" data-status="Cancelled">Cancel Order</button>
                </div>
            `;
            return card;
        }

        async function updateOrderStatus(orderId, newStatus) {
            const orderRef = doc(db, `/artifacts/${appId}/public/data/orders`, orderId);
            try {
                await updateDoc(orderRef, { status: newStatus });
                console.log(`Order ${orderId} updated to ${newStatus}`);
            } catch (error) {
                console.error("Error updating order status: ", error);
                alert("Failed to update order status.");
            }
        }

        // --- 4. PRODUCT MANAGEMENT ---

        async function loadProducts() {
            const productsQuery = query(collection(db, `/artifacts/${appId}/public/data/products`));
            const querySnapshot = await getDocs(productsQuery);
            productsContainer.innerHTML = '';
            querySnapshot.forEach(doc => {
                const product = { id: doc.id, ...doc.data() };
                const productEl = createProductListItem(product);
                productsContainer.appendChild(productEl);
            });
        }

        function createProductListItem(product) {
            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-md';
            item.innerHTML = `
                <div>
                    <p class="font-semibold">${product.name}</p>
                    <p class="text-sm text-gray-500">₹${product.price}</p>
                </div>
                <button data-id="${product.id}" class="delete-product-btn text-red-500 hover:text-red-700 font-semibold">Remove</button>
            `;
            return item;
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('product-name').value;
            const price = parseFloat(document.getElementById('product-price').value);
            const imageUrl = document.getElementById('product-image-url').value;

            if (!name || isNaN(price) || !imageUrl) {
                alert("Please fill all product fields correctly.");
                return;
            }

            const newProduct = { name, price, imageUrl };
            try {
                // Using a simplified name as the ID for easier management
                const docId = name.toLowerCase().replace(/\s+/g, '-');
                await setDoc(doc(db, `/artifacts/${appId}/public/data/products`, docId), newProduct);
                alert("Product added successfully!");
                productForm.reset();
                loadProducts(); // Refresh the list
            } catch (error) {
                console.error("Error adding product: ", error);
                alert("Failed to add product.");
            }
        }

        async function deleteProduct(productId) {
            if (!confirm("Are you sure you want to delete this product?")) return;
            try {
                await deleteDoc(doc(db, `/artifacts/${appId}/public/data/products`, productId));
                alert("Product deleted successfully!");
                loadProducts(); // Refresh the list
            } catch (error) {
                console.error("Error deleting product: ", error);
                alert("Failed to delete product.");
            }
        }

        // --- 5. EVENT LISTENERS & INITIALIZATION ---

        loginForm.addEventListener('submit', handleLogin);
        logoutButton.addEventListener('click', handleLogout);
        productForm.addEventListener('submit', handleProductSubmit);

        ordersTab.addEventListener('click', () => {
            ordersSection.classList.remove('hidden');
            productsSection.classList.add('hidden');
            ordersTab.classList.add('border-blue-500', 'text-blue-600');
            productsTab.classList.remove('border-blue-500', 'text-blue-600');
        });

        productsTab.addEventListener('click', () => {
            productsSection.classList.remove('hidden');
            ordersSection.classList.add('hidden');
            productsTab.classList.add('border-blue-500', 'text-blue-600');
            ordersTab.classList.remove('border-blue-500', 'text-blue-600');
        });

        // Event delegation for dynamically created buttons
        document.addEventListener('click', (e) => {
            if (e.target.matches('.update-status-btn')) {
                const orderId = e.target.dataset.id;
                const newStatus = e.target.dataset.status;
                updateOrderStatus(orderId, newStatus);
            }
            if (e.target.matches('.delete-product-btn')) {
                const productId = e.target.dataset.id;
                deleteProduct(productId);
            }
        });

    </script>
</body>
</html>
